<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens e suporte — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="wide-shell"><div id="sidebar"></div><main class="main"><div class="messages-shell"><h1 class="display" style="font-size:23px">Mensagens e suporte</h1><p class="small muted" style="margin:5px 0 16px">Atenda clientes, barbeiros e barbearias pela central.</p><div class="barber-tabs" id="filters" style="margin-bottom:12px"><button class="chip selected" data-filter="todos">Todos</button><button class="chip" data-filter="cliente">Clientes</button><button class="chip" data-filter="barbeiro">Barbeiros</button><button class="chip" data-filter="barbearia">Barbearias</button></div><div class="messages-layout"><div class="conversation-list" id="conversation-list"></div><section class="message-panel"><header class="message-panel-head" id="panel-head"></header><div class="message-thread" id="message-thread"></div><form class="message-composer" id="message-form"><input id="message-input" maxlength="500" placeholder="Responder como suporte..." style="flex:1" autocomplete="off"><button class="btn btn-primary">Enviar</button></form></section></div></div></main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>
renderSidebar('mensagens','admin');const KEY='cortaki_support_threads';let filter='todos',selectedId=null;function esc(value){const el=document.createElement('div');el.textContent=String(value??'');return el.innerHTML}function all(){const data=safeStoredJSON(KEY,{})||{};return Object.values(data).sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0))}function visible(){return all().filter(t=>filter==='todos'||t.profileType===filter)}function saveThread(thread){const data=safeStoredJSON(KEY,{})||{};data[thread.id]=thread;localStorage.setItem(KEY,JSON.stringify(data))}
function renderList(){const rows=visible();if(!rows.some(x=>x.id===selectedId))selectedId=rows[0]?.id||null;document.getElementById('conversation-list').innerHTML=rows.length?rows.map(t=>{const last=t.messages?.[t.messages.length-1],unread=(t.messages||[]).filter(m=>m.from!=='admin'&&m.readByAdmin===false).length;return`<button class="conversation-item ${t.id===selectedId?'active':''}" data-id="${esc(t.id)}"><span class="conversation-avatar">${appIcon(t.profileType==='cliente'?'user':t.profileType==='barbearia'?'shop':'scissors')}</span><span class="conversation-main"><span class="conversation-name">${esc(t.profileName)} ${unread?`<span class="badge badge-gold">${unread}</span>`:''}</span><span class="conversation-preview">${esc(last?.text||'Novo chamado')} · ${t.profileType}</span></span></button>`}).join(''):'<div class="empty-state" style="padding:24px 8px">Nenhum chamado recebido.</div>';document.querySelectorAll('.conversation-item').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;markRead();renderList();renderPanel()});renderPanel()}
function selected(){return all().find(x=>x.id===selectedId)}function markRead(){const t=selected();if(!t)return;let changed=false;(t.messages||[]).forEach(m=>{if(m.from!=='admin'&&m.readByAdmin===false){m.readByAdmin=true;changed=true}});if(changed)saveThread(t)}function renderPanel(){const t=selected(),head=document.getElementById('panel-head'),thread=document.getElementById('message-thread'),form=document.getElementById('message-form');if(!t){head.innerHTML='<strong>Selecione um chamado</strong>';thread.innerHTML='<div class="empty-state">As conversas de suporte aparecerão aqui.</div>';form.style.display='none';return}form.style.display='flex';head.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><div><strong>${esc(t.profileName)}</strong><div class="small muted" style="margin-top:3px;text-transform:capitalize">${esc(t.profileType)} · ${esc(t.profileId)}</div></div><span class="badge ${t.status==='Resolvido'?'badge-success':'badge-gold'}">${esc(t.status||'Aberto')}</span></div><button class="btn btn-secondary btn-sm" id="resolve-button" style="margin-top:8px">${t.status==='Resolvido'?'Reabrir chamado':'Marcar como resolvido'}</button>`;document.getElementById('resolve-button').onclick=()=>{t.status=t.status==='Resolvido'?'Aberto':'Resolvido';t.updatedAt=new Date().toISOString();saveThread(t);renderList()};thread.innerHTML=(t.messages||[]).map(m=>`<div class="chat-bubble ${m.from==='admin'?'barber':'customer'}">${esc(m.text)}<div style="font-size:10px;opacity:.65;margin-top:3px">${m.from==='admin'?'Suporte':esc(t.profileName)} · ${new Date(m.at||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');thread.scrollTop=thread.scrollHeight}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;selectedId=null;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));renderList()});document.getElementById('message-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('message-input'),text=input.value.trim(),t=selected();if(!text||!t)return;t.messages=t.messages||[];t.messages.push({from:'admin',text,at:new Date().toISOString(),readByProfile:false});t.updatedAt=new Date().toISOString();t.status='Aberto';saveThread(t);input.value='';renderList()};renderList();window.addEventListener('storage',renderList);
</script></body></html>
