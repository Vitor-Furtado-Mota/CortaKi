<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearias — Admin Navalha</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="wide-shell">
  <div id="sidebar"></div>
  <div class="main">
    <h1 class="display" style="font-size:22px; margin-bottom:6px;">Barbearias</h1>
    <p class="muted small" style="margin-bottom:22px;">Estabelecimentos parceiros e seus barbeiros vinculados.</p>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <div id="cards"></div>

      <div class="section-title" style="margin-top:12px;"><h2>Barbeiros autônomos</h2></div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Barbeiro</th><th>Bairro</th><th>Avaliação</th><th>Faturamento</th></tr></thead>
          <tbody id="autonomos"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  renderSidebar('barbearias', 'admin');

  document.getElementById('cards').innerHTML = BARBERSHOPS.map(shop => {
    const barbers = BARBERS.filter(b => b.shopId === shop.id);
    const gross = barbers.reduce((s, b) => s + computeWallet(b).gross, 0);
    const completedCount = barbers.reduce((s, b) => s + computeWallet(b).completed.length, 0);
    return `
      <a href="barbearia-detalhe.html?id=${shop.id}" class="card" style="display:flex; align-items:center; gap:16px; margin-bottom:12px;">
        <div style="width:48px; height:48px; border-radius:13px; background:var(--gold-wash); display:flex; align-items:center; justify-content:center; font-size:22px;">🏪</div>
        <div style="flex:1;">
          <div style="font-weight:700; font-size:15px;">${shop.name}</div>
          <div class="small muted">📍 ${shop.neighborhood} · ${shop.distanceKm} km · ${barbers.length} barbeiro(s)</div>
        </div>
        <div style="text-align:right;">
          <div class="mono" style="font-weight:700; color:var(--gold-bright);">${formatBRL(gross)}</div>
          <div class="small muted">${completedCount} atendimentos</div>
        </div>
        <span style="color:var(--gold-bright); font-size:18px;">→</span>
      </a>
    `;
  }).join('');

  const autonomos = BARBERS.filter(b => !b.shopId);
  document.getElementById('autonomos').innerHTML = autonomos.length ? autonomos.map(b => {
    const w = computeWallet(b);
    return `<tr class="clickable" onclick="location.href='barbeiro-detalhe.html?id=${b.id}'">
      <td style="display:flex; align-items:center; gap:9px;"><img src="${b.photo}" style="width:26px; height:26px; border-radius:7px;">${b.name}</td>
      <td class="muted">${b.neighborhood}</td>
      <td>${b.rating} ★</td>
      <td class="mono">${formatBRL(w.gross)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="muted" style="text-align:center; padding:24px;">Nenhum barbeiro autônomo.</td></tr>`;
</script>
</body>
</html>
