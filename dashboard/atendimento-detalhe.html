<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento em andamento — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="wide-shell"><div id="sidebar"></div><main class="main"><div style="max-width:780px;margin:0 auto"><a href="chamar.html" class="link">← Voltar para Chamar agora</a><div id="content" style="margin-top:16px"></div></div></main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>
renderSidebar('chamar','barber');const id=qs('id'),APT_KEY='navalha_appointments',CHAT_KEY='navalha_appointment_chats',REPORT_KEY='navalha_appointment_reports';let mapProgress=0,problemPhoto='';
function all(){const list=safeStoredJSON(APT_KEY,[]);return Array.isArray(list)?list:[]}function appointment(){return all().find(a=>a.id===id)}function update(mutator){const list=all(),a=list.find(x=>x.id===id);if(!a)return;mutator(a);localStorage.setItem(APT_KEY,JSON.stringify(list));render()}
function chats(){return safeStoredJSON(CHAT_KEY,{})||{}}function saveChats(data){localStorage.setItem(CHAT_KEY,JSON.stringify(data))}
function render(){const a=appointment(),root=document.getElementById('content');if(!a){root.innerHTML='<div class="empty-state">Atendimento não encontrado.</div>';return}const done=['Concluído','Cancelado','Encerrado sem verificação'].includes(a.status);root.innerHTML=`
<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px"><div><h1 class="display" style="font-size:22px">${a.customerName}</h1><p class="small muted" style="margin-top:4px">${(a.serviceNames||[]).join(' + ')}</p></div><span class="badge ${statusBadgeClass(a.status)}">${a.status}</span></div>
<div class="live-map" aria-label="Mapa da localização do cliente em tempo real"><div class="map-eta"><strong id="eta">${Math.max(2,9-mapProgress)} min</strong><br><span style="opacity:.75">até o cliente · localização ao vivo simulada</span></div><div class="map-route"></div><div class="map-marker barber" id="barber-marker">${appIcon('scissors')}</div><div class="map-marker customer">${appIcon('user')}</div></div>
<div class="card" style="margin-top:12px"><div class="ticket-row"><span class="label">Destino</span><span style="text-align:right;max-width:65%">${a.address||'Endereço não informado'}</span></div><div class="ticket-row"><span class="label">Distância</span><span>${a.distanceKm||2.1} km</span></div><div class="ticket-row"><span class="label">Pagamento</span><span>${a.payment?.method||'—'} · ${a.payment?.status||'Retido'}</span></div><div class="ticket-row"><span class="label">Valor</span><strong class="mono">${formatBRL(a.price||0)}</strong></div></div>
${!done?`<div class="trip-actions" style="margin-top:12px"><button class="btn btn-secondary" onclick="setStatus('A caminho')">Estou a caminho</button><button class="btn btn-secondary" onclick="document.getElementById('chat-section').scrollIntoView({behavior:'smooth'})">Conversar com cliente</button></div>`:''}
${!done&&['Confirmado','A caminho','Em atendimento'].includes(a.status)?`<div class="emergency-panel"><strong>Precisa de ajuda?</strong><div class="small">O alerta fica registrado e é mostrado para você e para o cliente.</div><div class="emergency-actions"><button class="btn btn-danger emergency-button" onclick="activateAppointmentEmergency('${a.id}','barber')">🚨 Acionar emergência</button><a class="btn btn-secondary" href="tel:190">Ligar para o 190</a></div></div>`:''}
<div class="section-title"><h2>Código de segurança</h2></div><div class="card"><p class="small muted" style="margin-bottom:12px">Peça ao cliente o código de 6 dígitos antes de iniciar o serviço.</p><div class="field"><label>Código informado pelo cliente</label><input class="security-code-input" id="security-input" inputmode="numeric" maxlength="6" placeholder="000000" ${a.securityVerified?'disabled':''}></div><button class="btn btn-primary btn-block" onclick="verifyCode()" ${a.securityVerified?'disabled':''}>${a.securityVerified?'✓ Código confirmado':'Confirmar código e iniciar'}</button><div id="security-message" class="small" style="margin-top:9px;text-align:center;color:${a.securityVerified?'var(--success)':'var(--text-muted)'}">${a.securityVerified?'Atendimento protegido e liberado.':'O serviço só inicia após a validação.'}</div>${a.securityVerified&&!done?'<button class="btn btn-secondary btn-block" style="margin-top:9px" onclick="finishService()">Concluir atendimento</button>':''}</div>
<div id="chat-section" class="section-title"><h2>Chat com o cliente</h2></div><div class="card"><div class="chat-thread" id="chat-thread"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="chat-input" placeholder="Digite uma mensagem" style="flex:1"><button class="btn btn-primary" onclick="sendChat()">Enviar</button></div></div>
<div class="section-title"><h2>Reportar um problema</h2></div><form class="card" id="problem-form"><div class="field"><label>Tipo do problema</label><select id="problem-type" required><option value="">Selecione</option><option>Cliente não está no local</option><option>Endereço incorreto</option><option>Risco ou falta de segurança</option><option>Problema com pagamento</option><option>Outro problema</option></select></div><div class="field"><label>Explique o ocorrido</label><textarea id="problem-text" rows="4" required placeholder="Descreva o problema com detalhes"></textarea></div><div class="field"><label>Foto como evidência (opcional)</label><input id="problem-photo" type="file" accept="image/*" capture="environment"></div><div id="photo-slot"></div><button class="btn btn-secondary btn-block">Enviar para análise</button><div id="report-message" class="small" style="display:none;margin-top:9px;text-align:center;color:var(--success)">Problema enviado para análise.</div></form>`;renderChat();bindReport();moveMarker()}
function setStatus(status){update(a=>a.status=status)}function verifyCode(){const a=appointment(),value=document.getElementById('security-input').value.replace(/\D/g,'');if(value!==String(a.securityCode||'')){const m=document.getElementById('security-message');m.textContent='Código incorreto. Confirme os 6 dígitos com o cliente.';m.style.color='var(--danger)';return}update(x=>{x.securityVerified=true;x.status='Em atendimento';x.startedAt=new Date().toISOString()})}async function finishService(){if(await showAppConfirm('Confirmar que o atendimento foi concluído?',{title:'Concluir atendimento'}))update(a=>{a.status='Concluído';a.completedAt=new Date().toISOString();if(a.payment)a.payment.status='Liberado'})}
function renderChat(){const data=chats(),messages=data[id]||[{from:'customer',text:'Olá! Estou aguardando no endereço informado.',at:new Date().toISOString()}];document.getElementById('chat-thread').innerHTML=messages.map(m=>`<div class="chat-bubble ${m.from==='barber'?'barber':'customer'}">${escapeHTML(m.text)}<div style="font-size:10px;opacity:.65;margin-top:3px">${new Date(m.at||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('');document.getElementById('chat-thread').scrollTop=9999}function sendChat(){const input=document.getElementById('chat-input'),text=input.value.trim();if(!text)return;const data=chats();if(!Array.isArray(data[id]))data[id]=[];data[id].push({from:'barber',text,at:new Date().toISOString()});saveChats(data);input.value='';renderChat()}
function bindReport(){document.getElementById('problem-photo').onchange=async e=>{try{problemPhoto=await readProfileImage(e.target.files[0]);document.getElementById('photo-slot').innerHTML=`<img src="${problemPhoto}" class="problem-photo-preview" alt="Evidência do problema">`}catch(err){alert(err.message)}};document.getElementById('problem-form').onsubmit=e=>{e.preventDefault();const reports=safeStoredJSON(REPORT_KEY,[]),report={id:`report-${Date.now()}`,appointmentId:id,barberId:DEMO_USERS.barber.id,type:document.getElementById('problem-type').value,description:document.getElementById('problem-text').value.trim(),photo:problemPhoto||null,status:'Em análise',createdAt:new Date().toISOString()};reports.push(report);localStorage.setItem(REPORT_KEY,JSON.stringify(reports));document.getElementById('report-message').style.display='block';e.target.reset();problemPhoto='';document.getElementById('photo-slot').innerHTML=''}}function moveMarker(){const marker=document.getElementById('barber-marker');if(!marker)return;marker.style.transform=`translate(${mapProgress*18}px,${mapProgress*-8}px) rotate(-45deg)`}
render();const liveTimer=setInterval(()=>{const a=appointment();if(!a||!['Confirmado','A caminho'].includes(a.status)||mapProgress>=7)return;mapProgress++;moveMarker();const eta=document.getElementById('eta');if(eta)eta.textContent=`${Math.max(2,9-mapProgress)} min`;localStorage.setItem(`navalha_live_location_${id}`,JSON.stringify({progress:mapProgress,updatedAt:new Date().toISOString()}))},5000);
</script></body></html>
