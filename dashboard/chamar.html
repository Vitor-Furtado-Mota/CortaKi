<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamar agora — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="wide-shell"><div id="sidebar"></div><main class="main"><div style="max-width:760px;margin:0 auto">
<h1 class="display" style="font-size:23px">Chamar agora</h1><p class="small muted" style="margin:5px 0 18px">Controle seu expediente e acompanhe atendimentos por etapa.</p>
<div class="card call-status-card"><div class="copy"><strong id="work-title">Disponível para chamadas</strong><div class="small muted" id="work-copy">Clientes próximos poderão enviar solicitações.</div></div><label class="toggle"><input type="checkbox" id="work-toggle"><span class="track"></span></label></div>
<div class="barber-tabs" id="tabs" style="margin:18px 0"><button class="chip selected" data-tab="novos">Novas chamadas</button><button class="chip" data-tab="andamento">Em andamento</button><button class="chip" data-tab="concluidos">Concluídos</button></div><div id="list"></div>
</div></main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>
renderSidebar('chamar','barber');const me=DEMO_USERS.barber,APT_KEY='navalha_appointments',ONLINE_KEY=`cortaki_barber_chamar_online_${me.id}`;let tab='novos';
function readAll(){let saved=safeStoredJSON(APT_KEY,[]);if(!Array.isArray(saved))saved=[];if(!saved.some(a=>a.id==='call-demo-1'))saved.push({id:'call-demo-1',customerId:'customer-2',customerName:'Bruno Santos',barberId:me.id,barberName:me.name,serviceNames:['Corte de cabelo','Barba'],type:'domicilio',mode:'chamada',address:'Rua dos Ipês, 88 — Vila Nova',date:'Hoje',time:'Agora',price:100,status:'Solicitado',payment:{method:'Pix',status:'Pago'},distanceKm:2.1,securityCode:'483921',securityVerified:false,customerLocation:{lat:-23.533,lng:-46.347}});localStorage.setItem(APT_KEY,JSON.stringify(saved));return saved;}
function saveAll(list){localStorage.setItem(APT_KEY,JSON.stringify(list));}
const toggle=document.getElementById('work-toggle');toggle.checked=localStorage.getItem(ONLINE_KEY)!=='false';function paintStatus(){document.getElementById('work-title').textContent=toggle.checked?'Expediente iniciado':'Chamar agora desativado';document.getElementById('work-copy').textContent=toggle.checked?'Você está visível e pode receber novas chamadas.':'Você não receberá solicitações instantâneas.';}toggle.onchange=()=>{localStorage.setItem(ONLINE_KEY,String(toggle.checked));paintStatus();render()};paintStatus();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));render()});
function filtered(){return readAll().filter(a=>a.barberId===me.id&&a.mode==='chamada'&&(tab==='novos'?a.status==='Solicitado':tab==='andamento'?['Confirmado','A caminho','Em atendimento'].includes(a.status):['Concluído','Cancelado','Encerrado sem verificação'].includes(a.status)));}
function render(){const rows=filtered();document.getElementById('list').innerHTML=rows.length?rows.map(a=>`<div class="card" style="margin-bottom:11px"><div style="display:flex;gap:12px;align-items:flex-start"><img src="${avatarFor(a.customerId,a.customerName)}" style="width:50px;height:50px;border-radius:15px"><div style="flex:1;min-width:0"><strong>${a.customerName}</strong><div class="small muted" style="margin-top:3px">${(a.serviceNames||[]).join(' + ')}</div><div class="small muted" style="margin-top:3px">📍 ${a.address||'Endereço do cliente'}${a.distanceKm?` · ${a.distanceKm} km`:''}</div></div><strong class="mono" style="color:var(--gold-bright)">${formatBRL(a.price||0)}</strong></div><div class="ticket-row" style="margin-top:12px"><span class="label">Status</span><span class="badge ${statusBadgeClass(a.status)}">${a.status}</span></div>${tab==='novos'?`<div style="display:flex;gap:9px;margin-top:13px"><button class="btn btn-secondary btn-block" onclick="decide('${a.id}',false)">Recusar</button><button class="btn btn-primary btn-block" onclick="decide('${a.id}',true)">Aceitar</button></div>`:`<a class="btn ${tab==='andamento'?'btn-primary':'btn-secondary'} btn-block" href="atendimento-detalhe.html?id=${a.id}" style="margin-top:13px">${tab==='andamento'?'Acompanhar atendimento':'Ver detalhes'}</a>`}</div>`).join(''):`<div class="empty-state"><div class="icon">${tab==='novos'?'🔔':tab==='andamento'?'⚡':'✓'}</div>Nenhum atendimento nesta etapa.</div>`;}
function decide(id,accept){const list=readAll(),a=list.find(x=>x.id===id);if(!a)return;if(accept){a.status='Confirmado';a.acceptedAt=new Date().toISOString();saveAll(list);location.href=`atendimento-detalhe.html?id=${id}`;}else{a.status='Cancelado';a.payment.status='Reembolsado';saveAll(list);render();}}
render();window.addEventListener('storage',render);
</script></body></html>
