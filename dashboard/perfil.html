<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil profissional — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><div class="wide-shell"><div id="sidebar"></div><main class="main"><div class="barber-profile-shell">
  <div class="barber-profile-head"><img id="cover-preview" class="profile-cover" alt="Capa"><img id="avatar-preview" class="profile-avatar" alt="Foto do barbeiro"></div>
  <div class="barber-profile-summary"><h1 id="profile-name" class="display" style="font-size:21px"></h1><div class="small muted" id="profile-meta"></div></div>
  <div class="call-status-card card" style="margin:20px 0"><span class="menu-icon">⚡</span><div class="copy"><strong>Chamar agora</strong><div class="small muted">Disponibilidade, chamadas e atendimentos</div></div><a href="chamar.html" class="btn btn-secondary btn-sm">Abrir</a></div>
  <div class="section-title"><h2>Editar perfil profissional</h2></div>
  <form id="profile-form" class="card"><div class="management-grid-2"><div class="field"><label>Foto de perfil</label><input id="avatar-file" type="file" accept="image/*"></div><div class="field"><label>Foto de fundo</label><input id="cover-file" type="file" accept="image/*"></div></div><div class="field"><label>Nome</label><input id="name" required></div><div class="field"><label>Bio</label><textarea id="bio" rows="4"></textarea></div><div class="field"><label>Bairro</label><input id="neighborhood" required></div><button class="btn btn-primary btn-block">Salvar alterações</button><div id="msg" class="small" style="display:none;margin-top:10px;text-align:center;color:var(--success)">Perfil salvo com sucesso ✓</div></form>
  <div class="section-title"><h2>Atalhos</h2></div><div class="account-menu"><a class="card account-menu-item" href="servicos.html"><span class="menu-icon">✂️</span><span class="menu-copy"><span class="menu-title">Meus serviços</span><span class="menu-subtitle">Preços, duração e modalidades</span></span><span class="menu-arrow">›</span></a><a class="card account-menu-item" href="catalogo.html"><span class="menu-icon">🖼️</span><span class="menu-copy"><span class="menu-title">Catálogo</span><span class="menu-subtitle">Fotos dos seus trabalhos</span></span><span class="menu-arrow">›</span></a><a class="card account-menu-item" href="agenda.html"><span class="menu-icon">🗓️</span><span class="menu-copy"><span class="menu-title">Agenda</span><span class="menu-subtitle">Horários e bloqueios</span></span><span class="menu-arrow">›</span></a></div>
</div></main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>
renderSidebar('perfil','barber');const base=DEMO_USERS.barber,KEY=`cortaki_barber_profile_${base.id}`;let profile={...base,...safeStoredJSON(KEY,{})};const fallbackCover='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300"><defs><linearGradient id="g"><stop stop-color="#3a2b1a"/><stop offset="1" stop-color="#111116"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/></svg>`);function paint(){document.getElementById('avatar-preview').src=profile.photo||avatarFor(base.id,profile.name);document.getElementById('cover-preview').src=profile.coverPhoto||fallbackCover;document.getElementById('profile-name').textContent=profile.name;document.getElementById('profile-meta').textContent=`${profile.neighborhood||'Bairro não informado'} · ${profile.rating} ★ · ${profile.reviewCount} avaliações`;}['name','bio','neighborhood'].forEach(k=>document.getElementById(k).value=profile[k]||'');document.getElementById('avatar-file').onchange=async e=>{try{profile.photo=await readProfileImage(e.target.files[0]);paint()}catch(err){alert(err.message);e.target.value=''}};document.getElementById('cover-file').onchange=async e=>{try{profile.coverPhoto=await readProfileImage(e.target.files[0]);paint()}catch(err){alert(err.message);e.target.value=''}};document.getElementById('profile-form').onsubmit=e=>{e.preventDefault();['name','bio','neighborhood'].forEach(k=>profile[k]=document.getElementById(k).value.trim());localStorage.setItem(KEY,JSON.stringify({name:profile.name,bio:profile.bio,neighborhood:profile.neighborhood,photo:profile.photo,coverPhoto:profile.coverPhoto}));paint();const m=document.getElementById('msg');m.style.display='block';setTimeout(()=>m.style.display='none',1800)};paint();
</script></body></html>
