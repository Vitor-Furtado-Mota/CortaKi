<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de mensagens — CortaKi</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app-shell"><div id="topbar"></div><main class="page"><div class="messages-shell"><h1 class="display" style="font-size:21px">Central de mensagens</h1><p class="small muted" style="margin:5px 0 16px">Atendimentos e suporte em um só lugar.</p><div class="barber-tabs" id="message-tabs" style="margin-bottom:12px"><button class="chip selected" data-tab="atendimentos">Atendimentos</button><button class="chip" data-tab="suporte">Suporte CortaKi</button></div><div class="messages-layout"><div class="conversation-list" id="conversation-list"></div><section class="message-panel"><header class="message-panel-head" id="panel-head"></header><div class="message-thread" id="message-thread"></div><form class="message-composer" id="message-form"><input id="message-input" maxlength="500" placeholder="Digite uma mensagem..." style="flex:1" autocomplete="off"><button class="btn btn-primary" type="submit">Enviar</button></form></section></div></div></main><div id="bottom-nav"></div></div><script src="assets/js/mock-data.js"></script><script src="assets/js/app.js"></script><script>
const requestedRole=qs('perfil'),role=['cliente','barbeiro','barbearia'].includes(requestedRole)?requestedRole:'cliente',identity=role==='cliente'?{id:DEMO_USERS.customer.id,name:localStorage.getItem('navalha_customer_name')||DEMO_USERS.customer.name}:{...role==='barbeiro'?DEMO_USERS.barber:DEMO_USERS.shop};const roleLabel={cliente:'Cliente',barbeiro:'Barbeiro',barbearia:'Barbearia'}[role],returnPath=role==='barbeiro'?'dashboard/index.html':role==='barbearia'?'barbearia-dashboard/index.html':null;renderTopbar({title:'Mensagens'});if(role==='cliente')renderBottomNav('mensagens');else document.getElementById('bottom-nav').remove();if(returnPath){document.querySelector('#topbar .back-btn').onclick=()=>location.href=returnPath}
const CHAT_KEY='navalha_appointment_chats',SUPPORT_KEY='cortaki_support_threads',APT_KEY='navalha_appointments';let tab='atendimentos',selectedId=null;
function esc(value){const el=document.createElement('div');el.textContent=String(value??'');return el.innerHTML}function allAppointments(){const saved=safeStoredJSON(APT_KEY,[]);return [...(Array.isArray(saved)?saved:[]),...APPOINTMENTS].filter((a,i,list)=>list.findIndex(x=>x.id===a.id)===i)}function appointmentThreads(){if(role==='barbearia')return[];const chats=safeStoredJSON(CHAT_KEY,{})||{};return allAppointments().filter(a=>role==='cliente'?a.customerId===identity.id:a.barberId===identity.id).filter(a=>['Confirmado','A caminho','Em atendimento','Concluído'].includes(a.status)||Array.isArray(chats[a.id])).map(a=>{const messages=Array.isArray(chats[a.id])?chats[a.id]:[];return{id:a.id,name:role==='cliente'?a.barberName:a.customerName,subtitle:(a.serviceNames||[]).join(', '),messages,avatar:avatarFor(role==='cliente'?a.barberId:a.customerId,role==='cliente'?a.barberName:a.customerName)}})}
function supportData(){const all=safeStoredJSON(SUPPORT_KEY,{})||{},key=`${role}:${identity.id}`;if(!all[key]){all[key]={id:key,profileType:role,profileId:identity.id,profileName:identity.name,status:'Aberto',messages:[{from:'admin',text:`Olá, ${identity.name.split(' ')[0]}! Este é o suporte CortaKi. Como podemos ajudar?`,at:new Date().toISOString()}],updatedAt:new Date().toISOString()};localStorage.setItem(SUPPORT_KEY,JSON.stringify(all))}return all[key]}function currentThreads(){return tab==='suporte'?[{...supportData(),name:'Suporte CortaKi',subtitle:`Atendimento para ${roleLabel}`,avatar:null}]:appointmentThreads()}function openMobileChat(){if(innerWidth>650)return;document.querySelector('.messages-layout').classList.add('chat-open');document.querySelector('.messages-shell').classList.add('mobile-chat-open');document.body.classList.add('message-chat-open');scrollTo(0,0)}function closeMobileChat(){selectedId=null;document.querySelector('.messages-layout').classList.remove('chat-open');document.querySelector('.messages-shell').classList.remove('mobile-chat-open');document.body.classList.remove('message-chat-open');renderList()}
function renderList(){const threads=currentThreads();if(!threads.some(x=>x.id===selectedId))selectedId=innerWidth>650?(threads[0]?.id||null):null;document.getElementById('conversation-list').innerHTML=threads.length?threads.map(t=>{const last=t.messages?.[t.messages.length-1],time=last?.at?new Date(last.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';return`<button class="conversation-item ${t.id===selectedId?'active':''}" data-id="${esc(t.id)}"><span class="conversation-avatar">${t.avatar?`<img src="${t.avatar}" style="width:100%;height:100%;border-radius:inherit;object-fit:cover">`:appIcon('users')}</span><span class="conversation-main"><span class="conversation-name">${esc(t.name)} <small style="float:right;color:var(--text-faint);font-weight:400">${time}</small></span><span class="conversation-preview">${esc(last?.text||t.subtitle||'Inicie uma conversa')}</span></span></button>`}).join(''):'<div class="empty-state" style="padding:24px 8px">Nenhuma conversa de atendimento.</div>';document.querySelectorAll('.conversation-item').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;openMobileChat();renderList()});renderPanel()}
function selectedThread(){return currentThreads().find(x=>x.id===selectedId)}function renderPanel(){const t=selectedThread(),head=document.getElementById('panel-head'),thread=document.getElementById('message-thread'),form=document.getElementById('message-form');if(!t){head.innerHTML='<strong>Selecione uma conversa</strong>';thread.innerHTML='<div class="empty-state">Suas mensagens aparecerão aqui.</div>';form.style.display='none';return}form.style.display='flex';head.innerHTML=`<button class="message-back" type="button" aria-label="Voltar às conversas">‹</button><span class="message-contact-avatar">${t.avatar?`<img src="${t.avatar}" style="width:100%;height:100%;object-fit:cover">`:appIcon('users')}</span><span class="message-contact-copy"><strong style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</strong><span class="small muted">${tab==='suporte'?'<span class="support-status"><span class="badge-dot"></span> online</span>':esc(t.subtitle)}</span></span><span style="color:var(--text-muted)">⋮</span>`;head.querySelector('.message-back').onclick=closeMobileChat;thread.innerHTML=(t.messages||[]).length?(t.messages||[]).map(m=>{const own=tab==='suporte'?m.from===role:(role==='cliente'?m.from==='customer':m.from==='barber');return`<div class="chat-bubble ${own?'barber':'customer'}">${esc(m.text)}<div style="font-size:10px;opacity:.65;margin-top:3px;text-align:right">${new Date(m.at||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}${own?' ✓✓':''}</div></div>`}).join(''):'<div class="small muted">Nenhuma mensagem. Envie a primeira.</div>';thread.scrollTop=thread.scrollHeight}
function send(text){if(tab==='suporte'){const all=safeStoredJSON(SUPPORT_KEY,{})||{},key=`${role}:${identity.id}`,t=all[key]||supportData();t.messages.push({from:role,text,at:new Date().toISOString(),readByAdmin:false});t.updatedAt=new Date().toISOString();t.status='Aberto';all[key]=t;localStorage.setItem(SUPPORT_KEY,JSON.stringify(all))}else{const all=safeStoredJSON(CHAT_KEY,{})||{};if(!Array.isArray(all[selectedId]))all[selectedId]=[];all[selectedId].push({from:role==='cliente'?'customer':'barber',text,at:new Date().toISOString()});localStorage.setItem(CHAT_KEY,JSON.stringify(all))}renderList()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selectedId=null;document.querySelector('.messages-layout').classList.remove('chat-open');document.querySelector('.messages-shell').classList.remove('mobile-chat-open');document.body.classList.remove('message-chat-open');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));renderList()});document.getElementById('message-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('message-input'),text=input.value.trim();if(!text||!selectedId)return;send(text);input.value=''};renderList();window.addEventListener('storage',renderList);window.addEventListener('resize',()=>{if(innerWidth>650){document.querySelector('.messages-layout').classList.remove('chat-open');document.querySelector('.messages-shell').classList.remove('mobile-chat-open');document.body.classList.remove('message-chat-open');renderList()}});
</script></body></html>
