<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil da barbearia — CortaKi</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="app-shell"><div id="topbar"></div><main class="page" id="content"></main></div><script src="assets/js/mock-data.js"></script><script src="assets/js/app.js"></script><script>const base=getShopById(qs('id'))||DEMO_USERS.shop,shop=getShopPublicData(base),catalog=safeStoredJSON('cortaki_shop_catalog',[]),savedTeam=safeStoredJSON('cortaki_shop_barbers',null),team=Array.isArray(savedTeam)?savedTeam:BARBERS.filter(b=>b.shopId===shop.id);renderTopbar({title:shop.name});const coverFallback='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300"><defs><linearGradient id="g"><stop stop-color="#5c4226"/><stop offset="1" stop-color="#111116"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/></svg>`);document.getElementById('content').innerHTML=`<img src="${shop.coverPhoto||coverFallback}" class="profile-cover" alt="Capa da barbearia" style="margin-bottom:-42px"><div style="display:flex;align-items:end;gap:13px;padding:0 12px"><img src="${shop.photo||avatarFor(shop.id,shop.name)}" class="profile-avatar" alt="${shop.name}"><div style="padding-bottom:5px"><h1 class="display" style="font-size:20px">${shop.name}</h1><div class="small muted">📍 ${shop.neighborhood}</div></div></div><p class="small muted" style="margin-top:16px;line-height:1.6">${shop.description||''}</p><div class="card" style="margin-top:15px"><div class="small">📍 ${shop.address||shop.neighborhood}</div><div class="small muted" style="margin-top:5px">📞 ${shop.phone||'Contato não informado'}</div></div><div class="section-title"><h2>Catálogo da barbearia</h2></div>${catalog.length?`<div class="catalog-grid">${catalog.map(x=>`<div class="catalog-item"><img src="${x.image}" alt="${x.caption||'Trabalho da barbearia'}"><div class="caption">${x.caption||'Trabalho da equipe'}</div></div>`).join('')}</div>`:'<div class="card small muted">A barbearia ainda não publicou trabalhos.</div>'}<div class="section-title"><h2>Nossa equipe</h2></div><div style="display:flex;flex-direction:column;gap:9px">${team.map(b=>{const p=getBarberPublicData(b);return`<a class="card" href="barbeiro.html?id=${p.id}" style="display:flex;align-items:center;gap:11px"><img src="${p.photo||avatarFor(p.id,p.name)}" style="width:48px;height:48px;border-radius:13px;object-fit:cover"><div style="flex:1"><strong>${p.name}</strong><div class="small muted">${p.specialty||p.bio||'Barbeiro'}</div></div><span class="badge ${p.online?'badge-success':'badge-muted'}">${p.online?'Ativo':'Inativo'}</span></a>`}).join('')}</div>`;</script></body></html>
