<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Equipe — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><div class="wide-shell"><div id="sidebar"></div><main class="main">
  <h1 class="display" style="font-size:23px;">Barbeiros da equipe</h1><p class="small muted" style="margin:5px 0 22px;">Adicione e gerencie os profissionais vinculados à barbearia.</p>
  <form id="barber-form" class="card" style="max-width:760px;margin-bottom:24px;"><input type="hidden" id="barber-id">
    <div class="management-grid-2"><div class="field"><label>Nome completo</label><input id="barber-name" required></div><div class="field"><label>Telefone</label><input id="barber-phone" required placeholder="(11) 99999-9999"></div></div>
    <div class="management-grid-2"><div class="field"><label>E-mail</label><input id="barber-email" type="email" required></div><div class="field"><label>Especialidade</label><input id="barber-specialty" required placeholder="Ex.: Degradê"></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn btn-primary" type="submit" id="submit-barber">Adicionar barbeiro</button><button class="btn btn-secondary" type="button" id="cancel-edit" style="display:none;">Cancelar edição</button></div>
  </form><div class="section-title"><h2>Equipe cadastrada</h2></div><div id="barbers-list" style="max-width:760px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;"></div>
</main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>
renderSidebar('barbeiros','shop');const KEY='cortaki_shop_barbers';const shop=DEMO_USERS.shop;
let barbers=JSON.parse(localStorage.getItem(KEY)||'null')||BARBERS.filter(b=>b.shopId===shop.id).map(b=>({...b,phone:'(11) 9 0000-0000',email:b.name.toLowerCase().replaceAll(' ','.')+'@cortaki.com',specialty:'Cortes masculinos',active:true}));
const save=()=>localStorage.setItem(KEY,JSON.stringify(barbers));
function resetForm(){document.getElementById('barber-form').reset();document.getElementById('barber-id').value='';document.getElementById('submit-barber').textContent='Adicionar barbeiro';document.getElementById('cancel-edit').style.display='none';}
function render(){const list=document.getElementById('barbers-list');list.innerHTML=barbers.length?barbers.map(b=>`<div class="card"><div style="display:flex;gap:12px;align-items:center"><img src="${b.photo||avatarFor(b.id,b.name)}" style="width:52px;height:52px;border-radius:14px"><div><strong>${b.name}</strong><div class="small muted">${b.specialty}</div><span class="badge ${b.online?'badge-success':'badge-muted'}" style="margin-top:5px">${b.online?'Expediente ativo':'Fora do expediente'}</span></div></div><div class="small muted" style="margin:13px 0">${b.email}<br>${b.phone}</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn ${b.online?'btn-secondary':'btn-primary'} btn-sm" data-toggle="${b.id}">${b.online?'Encerrar expediente':'Iniciar expediente'}</button><button class="btn btn-secondary btn-sm" data-edit="${b.id}">Editar</button><button class="btn btn-ghost btn-sm" data-remove="${b.id}">Remover</button></div></div>`).join(''):'<div class="empty-state"><div class="icon">👥</div>Nenhum barbeiro cadastrado.</div>';
list.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{const b=barbers.find(x=>x.id===el.dataset.edit);document.getElementById('barber-id').value=b.id;document.getElementById('barber-name').value=b.name;document.getElementById('barber-phone').value=b.phone;document.getElementById('barber-email').value=b.email;document.getElementById('barber-specialty').value=b.specialty;document.getElementById('submit-barber').textContent='Salvar alterações';document.getElementById('cancel-edit').style.display='inline-flex';window.scrollTo({top:0,behavior:'smooth'});});
list.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>{const b=barbers.find(x=>x.id===el.dataset.toggle);b.online=!b.online;localStorage.setItem(`cortaki_barber_online_${b.id}`,String(b.online));save();render();});list.querySelectorAll('[data-remove]').forEach(el=>el.onclick=async()=>{if(await showAppConfirm('Remover este barbeiro da equipe?',{title:'Remover da equipe'})){barbers=barbers.filter(b=>b.id!==el.dataset.remove);save();render();}});}
document.getElementById('barber-form').onsubmit=e=>{e.preventDefault();const id=document.getElementById('barber-id').value;const old=barbers.find(b=>b.id===id);const b={...(old||{}),id:id||'shop-barber-'+Date.now(),shopId:shop.id,name:document.getElementById('barber-name').value.trim(),phone:document.getElementById('barber-phone').value.trim(),email:document.getElementById('barber-email').value.trim(),specialty:document.getElementById('barber-specialty').value.trim(),active:old?old.active!==false:true,online:old?.online||false,rating:old?.rating||0,reviewCount:old?.reviewCount||0};b.photo=old?.photo||avatarFor(b.id,b.name);const i=barbers.findIndex(x=>x.id===id);if(i>=0)barbers[i]=b;else barbers.push(b);save();resetForm();render();};document.getElementById('cancel-edit').onclick=resetForm;render();
</script></body></html>
