<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil da barbearia — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="wide-shell"><div id="sidebar"></div><main class="main"><h1 class="display" style="font-size:23px">Perfil da barbearia</h1><p class="small muted" style="margin:5px 0 20px">Essas informações serão exibidas aos clientes.</p><div style="max-width:680px;position:relative"><img id="cover-preview" class="profile-cover"><img id="avatar-preview" class="profile-avatar" style="position:absolute;left:18px;bottom:-24px"></div><form id="profile-form" class="card" style="max-width:680px;margin-top:38px"><div class="management-grid-2"><div class="field"><label>Foto de perfil</label><input id="avatar-file" type="file" accept="image/*"></div><div class="field"><label>Foto de fundo</label><input id="cover-file" type="file" accept="image/*"></div></div><div class="field"><label>Nome da barbearia</label><input id="name" required></div><div class="field"><label>Descrição</label><textarea id="description" rows="4"></textarea></div><div class="field"><label>Endereço</label><input id="address" required></div><div class="management-grid-2"><div class="field"><label>Bairro</label><input id="neighborhood" required></div><div class="field"><label>Telefone</label><input id="phone" required></div></div><button class="btn btn-primary">Salvar alterações</button><span id="saved" class="small" style="display:none;color:var(--success);margin-left:10px">Salvo ✓</span></form></main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>renderSidebar('perfil','shop');const KEY='cortaki_shop_profile',base=DEMO_USERS.shop;let profile={...base,...safeStoredJSON(KEY,{})};const coverFallback='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300"><defs><linearGradient id="g"><stop stop-color="#5c4226"/><stop offset="1" stop-color="#111116"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/></svg>`);function paint(){document.getElementById('avatar-preview').src=profile.photo||avatarFor(base.id,profile.name);document.getElementById('cover-preview').src=profile.coverPhoto||coverFallback}['name','description','address','neighborhood','phone'].forEach(k=>document.getElementById(k).value=profile[k]||'');document.getElementById('avatar-file').onchange=async e=>{try{profile.photo=await readProfileImage(e.target.files[0]);paint()}catch(err){alert(err.message);e.target.value=''}};document.getElementById('cover-file').onchange=async e=>{try{profile.coverPhoto=await readProfileImage(e.target.files[0]);paint()}catch(err){alert(err.message);e.target.value=''}};document.getElementById('profile-form').onsubmit=e=>{e.preventDefault();['name','description','address','neighborhood','phone'].forEach(k=>profile[k]=document.getElementById(k).value.trim());localStorage.setItem(KEY,JSON.stringify({name:profile.name,description:profile.description,address:profile.address,neighborhood:profile.neighborhood,phone:profile.phone,photo:profile.photo,coverPhoto:profile.coverPhoto}));const msg=document.getElementById('saved');msg.style.display='inline';setTimeout(()=>msg.style.display='none',1800)};paint();</script></body></html>
