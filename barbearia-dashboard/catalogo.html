<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo da barbearia — CortaKi</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="wide-shell"><div id="sidebar"></div><main class="main"><h1 class="display" style="font-size:23px">Catálogo da barbearia</h1><p class="small muted" style="margin:5px 0 20px">Publique trabalhos da equipe para os clientes. Limite: 6 fotos.</p><form id="catalog-form" class="card" style="max-width:680px;margin-bottom:22px"><div class="field"><label>Foto do trabalho</label><input id="work-photo" type="file" accept="image/*" required></div><div class="field"><label>Descrição</label><input id="work-caption" maxlength="80" placeholder="Ex.: Corte realizado pela nossa equipe"></div><button class="btn btn-primary">Adicionar ao catálogo</button></form><div id="catalog" class="catalog-grid" style="max-width:780px"></div></main></div><script src="../assets/js/mock-data.js"></script><script src="../assets/js/app.js"></script><script>renderSidebar('catalogo','shop');const KEY='cortaki_shop_catalog';let items=safeStoredJSON(KEY,[]);function render(){document.getElementById('catalog').innerHTML=items.length?items.map(x=>`<div class="catalog-item"><img src="${x.image}" alt="Trabalho da barbearia"><div class="caption">${x.caption||'Trabalho da equipe'}</div><button class="btn btn-ghost btn-sm" data-remove="${x.id}" style="position:absolute;right:7px;top:7px;background:rgba(0,0,0,.72)">Excluir</button></div>`).join(''):'<div class="empty-state"><div class="icon">🖼️</div>O catálogo da barbearia ainda está vazio.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.remove);localStorage.setItem(KEY,JSON.stringify(items));render()})}document.getElementById('catalog-form').onsubmit=async e=>{e.preventDefault();if(items.length>=6)return alert('O catálogo permite até 6 fotos nesta versão.');try{const image=await readProfileImage(document.getElementById('work-photo').files[0]);items.unshift({id:'shop-work-'+Date.now(),image,caption:document.getElementById('work-caption').value.trim()});localStorage.setItem(KEY,JSON.stringify(items));e.target.reset();render()}catch(err){alert(err.message)}};render();</script></body></html>
